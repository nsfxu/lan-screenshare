name: Release

# Builds the installers on GitHub's Windows and macOS machines.
#
# - Pushing a version tag (for example v1.2.0) builds them and publishes a
#   GitHub Release. The release notes are the tag's annotation message, so
#   create the tag with: git tag -a v1.2.0 --cleanup=verbatim -F notes.md
# - Running the workflow by hand (Actions → Release → Run workflow) only
#   builds them, as a dry run; the installers are kept as run artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Also compiles the audio helper with the csc.exe that ships with Windows.
      - run: npm run build
      - run: npx electron-builder --win --config electron-builder.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*/ScreenShare-Setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: check
    runs-on: macos-latest
    # The macOS build is still untested; it must not block a release.
    continue-on-error: true
    env:
      # No signing certificate yet: build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --config electron-builder.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*/ScreenShare-*.dmg
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [windows, macos]
    # Only for version tags, and only if the Windows installer was built.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the release notes from the tag annotation
        # checkout may leave a lightweight copy of the tag; fetch the annotated one.
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --title "ScreenShare $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
