name: Release

# Builds the installers on GitHub's Windows and macOS machines and, for a
# version, publishes a GitHub Release with them.
#
# Start a release in either way:
# - Actions → Release → Run workflow on main, with the version (for example
#   v1.2.0). The workflow creates the tag itself.
# - Push a version tag (git push origin v1.2.0).
#
# The version must match package.json. The release notes come from
# docs/releases/<version>.md, or from the annotation of a pushed tag.
# Running the workflow without a version is a dry run: it builds, lists what
# would be published, and keeps the installers as run artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example v1.2.0 (empty = build only)'
        required: false
        default: ''

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

# The installers are built while the tests run; nothing is published unless
# both the version check and the tests passed.
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        if: env.VERSION != ''
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::Version $VERSION doesn't match package.json ($expected)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run releases from main"
            exit 1
          fi
          # npm run release prepares both; the notes' TODOs are for a person to write.
          if ! grep -q "^## \[${VERSION#v}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION#v} (npm run release)"
            exit 1
          fi
          if [ -f "docs/releases/${VERSION}.md" ] && grep -n TODO "docs/releases/${VERSION}.md"; then
            echo "::error::docs/releases/${VERSION}.md still has TODOs"
            exit 1
          fi

  check:
    name: Typecheck and tests
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # CI (ci.yml) runs the same tests on every push: when its run on this very
      # commit passed, there's nothing new to test. Otherwise (a tag pushed on
      # another commit, CI failed or still running), they run here.
      - name: Already tested by CI?
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" -gt 0 ]; then
            echo "CI passed on $GITHUB_SHA, so the tests needn't run again."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ci.outputs.passed != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ci.outputs.passed != 'true'
      - run: npm run typecheck
        if: steps.ci.outputs.passed != 'true'
      - run: npm test
        if: steps.ci.outputs.passed != 'true'
      # Two real app instances in a room (see e2e/): don't publish a release
      # that can't share or watch.
      - run: npm run build
        if: steps.ci.outputs.passed != 'true'
      - name: End-to-end tests (Xvfb)
        if: steps.ci.outputs.passed != 'true'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Also compiles the Windows helpers with the csc.exe that ships with Windows.
      - run: npm run build
      - run: npx electron-builder --win --config electron-builder.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # latest.yml tells installed apps about this version (both installers, with their SHA-512).
          path: |
            release/*/ScreenShare-Setup-*.exe
            release/*/latest.yml
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: version
    runs-on: macos-latest
    # The macOS build is still untested; it must not block a release.
    continue-on-error: true
    # Signed with the self-signed certificate in the MAC_CERT_P12 secret
    # (scripts/mac-signing-cert.sh), so macOS keeps the app's Screen Recording
    # permission across updates; see scripts/mac-sign.cjs. Without the secret
    # (forks), ad hoc: without any valid signature, Apple Silicon Macs call a
    # downloaded app "damaged" and offer no way to open it. Not notarised either
    # way (that needs an Apple Developer ID), so the first launch still needs
    # Open Anyway.
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          # A keychain of its own, on the search list (codesign only finds identities there).
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Not trusted (self-signed), so not in `find-identity -v`; codesign signs with it by its hash.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::No code-signing identity in MAC_CERT_P12"; exit 1; }
          echo "MAC_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: npx electron-builder --mac --config electron-builder.json --publish never
      - name: Check the signature
        run: |
          for app in release/*/mac*/ScreenShare.app; do
            codesign --verify --deep --strict "$app"
            requirement=$(codesign -d -r- "$app" 2>&1 | grep designated)
            echo "$app: $requirement"
            # With the certificate, the requirement must name it: a build-hash one (cdhash) would lose permissions on update.
            if [ "$HAS_MAC_CERT" = true ] && ! echo "$requirement" | grep -q 'certificate leaf'; then
              echo "::error::$app isn't signed with the certificate"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*/ScreenShare-*.dmg
          if-no-files-found: error

  release:
    name: Release
    needs: [check, windows, macos]
    # Runs whenever the tests passed and the Windows installer was built, so a
    # dry run also checks what would be published. It only publishes when
    # there is a version.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Collect the installers
        # Artifacts keep their folders (for example 1.0.0/…), so look for the files.
        run: |
          find installers -type f \( -name '*.exe' -o -name '*.dmg' -o -name 'latest.yml' \) | sort > files.txt
          if [ ! -s files.txt ]; then
            echo "::error::No installers found"
            exit 1
          fi
          # Without it, installed apps would never hear about this version.
          if ! grep -q '/latest.yml$' files.txt; then
            echo "::error::No latest.yml: the Windows apps couldn't update to this version"
            exit 1
          fi
          while read -r f; do ls -l "$f"; done < files.txt
      - name: Find the release notes
        if: env.VERSION != ''
        run: |
          if [ -f "docs/releases/${VERSION}.md" ]; then
            cp "docs/releases/${VERSION}.md" notes.md
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # checkout may leave a lightweight copy of the tag; fetch the annotated one.
            git fetch --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            git tag -l --format='%(contents)' "$VERSION" > notes.md
          else
            echo "::error::No release notes: add docs/releases/${VERSION}.md"
            exit 1
          fi
          cat notes.md
      - name: Create the release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on this commit when it doesn't exist yet (runs started by hand).
        run: |
          mapfile -t files < files.txt
          gh release create "$VERSION" "${files[@]}" \
            --title "ScreenShare $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
