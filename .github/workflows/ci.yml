name: CI

# Type checks, unit tests and the end-to-end tests (two real app instances in a
# room, driven by Playwright on a virtual display) for every push, so a branch
# shows whether sharing, watching, chat and PINs still work before it's merged.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The job passes without running the app when that would test nothing new: only docs or the
      # version changed (a release commit), or a merge into main has exactly the files of a branch
      # that already passed (scripts/ci-scope.cjs). It's a required check, so it must still finish
      # (a workflow skipped by a path filter would leave it waiting).
      - name: Anything new to test?
        id: scope
        run: node scripts/ci-scope.cjs
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.app != 'false'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.app != 'false'
      - run: npm run build
        if: steps.scope.outputs.app != 'false'
      - name: Run the app (Xvfb)
        if: steps.scope.outputs.app != 'false'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
      - name: Keep the report and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
